<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>After Store - Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d0a14;
            --card-bg: #161224;
            --accent-purple: #8b5cf6;
            --neon-purple: #a855f7;
            --text-color: #f3f4f6;
            --text-dim: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR */
        header {
            background: rgba(22, 18, 36, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(139, 92, 246, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--accent-purple);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
            object-fit: cover;
        }

        .brand h1 {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #fff, var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-btns {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            background: #231c38;
            border: 1px solid var(--accent-purple);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-icon:hover {
            background: var(--accent-purple);
            box-shadow: 0 0 15px var(--accent-purple);
        }

        /* CATEGORIAS / ABAS */
        .tabs-container {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            overflow-x: auto;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: var(--text-dim);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.3s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--accent-purple);
            color: white;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
        }

        /* GRID DE PRODUTOS */
        .container {
            padding: 20px;
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid rgba(139, 92, 246, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.3);
            border-color: var(--neon-purple);
        }

        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-bottom: 1px solid rgba(139, 92, 246, 0.2);
        }

        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 15px;
            flex: 1;
        }

        .stock-tag {
            font-size: 0.75rem;
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            padding: 3px 8px;
            border-radius: 4px;
            width: fit-content;
            margin-bottom: 10px;
        }

        .stock-tag.out {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-size: 1.2rem;
            font-weight: 700;
            color: #a855f7;
        }

        .btn-buy {
            background: var(--accent-purple);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-buy:hover {
            background: var(--neon-purple);
            box-shadow: 0 0 10px var(--neon-purple);
        }

        /* SUPORTE FIXO */
        .support-tickets {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 99;
        }

        .btn-support {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: 0.3s;
        }

        .btn-support.discord { background: #5865F2; }
        .btn-support.whatsapp { background: #25D366; }
        .btn-support:hover { transform: scale(1.1); }

        /* PAINEL DO DONO (MODAL) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--accent-purple);
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h2 { margin-bottom: 15px; color: var(--neon-purple); }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 5px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            background: #0d0a14;
            border: 1px solid rgba(139, 92, 246, 0.4);
            color: white;
        }

        .btn-action {
            width: 100%;
            padding: 10px;
            background: var(--accent-purple);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-danger {
            background: #ef4444;
            margin-top: 5px;
        }

        .close-modal {
            float: right;
            cursor: pointer;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header>
        <div class="brand">
            <img src="https://via.placeholder.com/150" id="storeLogo" alt="Logo">
            <h1 id="storeName">After Store</h1>
        </div>
        <div class="nav-btns">
            <button class="btn-icon" onclick="openAdmin()"><i class="fa-solid fa-lock"></i> Dono</button>
        </div>
    </header>

    <!-- ABAS / CATEGORIAS -->
    <div class="tabs-container" id="tabsContainer">
        <button class="tab-btn active" onclick="filterCategory('todos')">Todos</button>
    </div>

    <!-- PRODUTOS -->
    <div class="container">
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- TICKETS FLUTUANTES -->
    <div class="support-tickets">
        <a href="https://discord.gg/BbBACKC5S" target="_blank" class="btn-support discord" title="Ticket Discord">
            <i class="fa-brands fa-discord"></i>
        </a>
        <a href="#" id="whatsBtn" target="_blank" class="btn-support whatsapp" title="Ticket WhatsApp">
            <i class="fa-brands fa-whatsapp"></i>
        </a>
    </div>

    <!-- MODAL PAINEL DO DONO -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeAdmin()">&times;</span>
            <h2><i class="fa-solid fa-gear"></i> Painel do Dono</h2>

            <!-- Configurações Gerais -->
            <h3>Configurar Loja</h3>
            <div class="form-group">
                <label>Nome da Loja</label>
                <input type="text" id="cfgName" placeholder="Ex: After Store">
            </div>
            <div class="form-group">
                <label>URL do Logo/Foto de Perfil</label>
                <input type="text" id="cfgLogo" placeholder="Cole o link da imagem">
            </div>
            <div class="form-group">
                <label>Número do WhatsApp (com DDD)</label>
                <input type="text" id="cfgWhats" placeholder="Ex: 5521999999999">
            </div>
            <button class="btn-action" onclick="saveStoreConfig()">Salvar Configurações</button>

            <hr style="border-color: rgba(255,255,255,0.1); margin: 20px 0;">

            <!-- Adicionar Produto -->
            <h3>Adicionar / Editar Produto</h3>
            <div class="form-group">
                <label>Nome do Produto</label>
                <input type="text" id="pName">
            </div>
            <div class="form-group">
                <label>Descrição</label>
                <textarea id="pDesc" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label>Preço (R$)</label>
                <input type="number" id="pPrice" step="0.01">
            </div>
            <div class="form-group">
                <label>Aba / Categoria</label>
                <input type="text" id="pCategory" placeholder="Ex: Contas, Frutas, Métodos">
            </div>
            <div class="form-group">
                <label>URL da Imagem do Produto</label>
                <input type="text" id="pImg" placeholder="https://link-da-imagem.com/foto.png">
            </div>
            <div class="form-group">
                <label>Quantidade em Estoque</label>
                <input type="number" id="pStock" value="1">
            </div>
            <button class="btn-action" onclick="addProduct()">Salvar Produto</button>

            <hr style="border-color: rgba(255,255,255,0.1); margin: 20px 0;">

            <!-- Gerenciar Estoque / Remover -->
            <h3>Gerenciar Produtos</h3>
            <div id="adminProductList"></div>
        </div>
    </div>

    <script>
        // BANCO DE DADOS LOCAL
        let storeConfig = JSON.parse(localStorage.getItem('after_config')) || {
            name: "After Store",
            logo: "1000073521.jpg",
            whats: "5521999999999"
        };

        let products = JSON.parse(localStorage.getItem('after_products')) || [
            {
                id: 1,
                name: "Conta Level 1K+ (Frutas)",
                desc: "Conta com frutas lendárias e level alto pronta para uso.",
                price: "25.00",
                category: "Contas",
                img: "1000073521.jpg",
                stock: 5
            }
        ];

        // INICIALIZAR SITE
        function initSite() {
            document.getElementById('storeName').innerText = storeConfig.name;
            document.getElementById('storeLogo').src = storeConfig.logo;
            document.getElementById('whatsBtn').href = `https://wa.me/${storeConfig.whats}?text=Ol%C3%A1,%20preciso%20de%20suporte%20na%20${encodeURIComponent(storeConfig.name)}`;
            
            renderCategories();
            renderProducts('todos');
        }

        // RENDERIZAR CATEGORIAS
        function renderCategories() {
            const tabsContainer = document.getElementById('tabsContainer');
            const categories = ['todos', ...new Set(products.map(p => p.category.toLowerCase()))];

            tabsContainer.innerHTML = categories.map(cat => `
                <button class="tab-btn ${cat === 'todos' ? 'active' : ''}" onclick="filterCategory('${cat}', this)">
                    ${cat.charAt(0).toUpperCase() + cat.slice(1)}
                </button>
            `).join('');
        }

        function filterCategory(cat, btn) {
            if(btn) {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            renderProducts(cat);
        }

        // RENDERIZAR PRODUTOS
        function renderProducts(filter = 'todos') {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            const filtered = filter === 'todos' 
                ? products 
                : products.filter(p => p.category.toLowerCase() === filter);

            filtered.forEach(p => {
                grid.innerHTML += `
                    <div class="card">
                        <img src="${p.img}" class="card-img" alt="${p.name}" onerror="this.src='https://via.placeholder.com/300x180?text=Sem+Imagem'">
                        <div class="card-body">
                            <span class="stock-tag ${p.stock <= 0 ? 'out' : ''}">
                                ${p.stock > 0 ? `Estoque 24h: ${p.stock}` : 'Esgotado'}
                            </span>
                            <div class="card-title">${p.name}</div>
                            <div class="card-desc">${p.desc}</div>
                            <div class="card-footer">
                                <div class="price">R$ ${parseFloat(p.price).toFixed(2)}</div>
                                <button class="btn-buy" onclick="buyProduct('${p.name}')" ${p.stock <= 0 ? 'disabled' : ''}>
                                    ${p.stock > 0 ? 'Comprar' : 'Sem Estoque'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // REDIRECIONAR COMPRA PARA DISCORD/WHATSAPP
        function buyProduct(pName) {
            const text = encodeURIComponent(`Olá! Quero comprar o produto: ${pName}`);
            window.open(`https://wa.me/${storeConfig.whats}?text=${text}`, '_blank');
        }

        // PAINEL DO DONO LOGICA
        function openAdmin() {
            const pass = prompt("Digite a Senha do Painel:");
            if(pass === "admin123" || pass === "after") { // SENHA DO PAINEL
                document.getElementById('cfgName').value = storeConfig.name;
                document.getElementById('cfgLogo').value = storeConfig.logo;
                document.getElementById('cfgWhats').value = storeConfig.whats;
                renderAdminProducts();
                document.getElementById('adminModal').style.display = 'flex';
            } else if (pass !== null) {
                alert("Senha incorreta!");
            }
        }

        function closeAdmin() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function saveStoreConfig() {
            storeConfig.name = document.getElementById('cfgName').value;
            storeConfig.logo = document.getElementById('cfgLogo').value;
            storeConfig.whats = document.getElementById('cfgWhats').value;
            localStorage.setItem('after_config', JSON.stringify(storeConfig));
            initSite();
            alert("Configurações salvas!");
        }

        function addProduct() {
            const name = document.getElementById('pName').value;
            const desc = document.getElementById('pDesc').value;
            const price = document.getElementById('pPrice').value;
            const category = document.getElementById('pCategory').value || "Geral";
            const img = document.getElementById('pImg').value;
            const stock = parseInt(document.getElementById('pStock').value);

            if(!name || !price) return alert("Preencha Nome e Preço!");

            products.push({ id: Date.now(), name, desc, price, category, img, stock });
            localStorage.setItem('after_products', JSON.stringify(products));
            
            initSite();
            renderAdminProducts();
            alert("Produto adicionado com sucesso!");
        }

        function removeProduct(id) {
            if(confirm("Tem certeza que deseja remover este produto?")) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('after_products', JSON.stringify(products));
                initSite();
                renderAdminProducts();
            }
        }

        function renderAdminProducts() {
            const list = document.getElementById('adminProductList');
            list.innerHTML = products.map(p => `
                <div style="display:flex; justify-content:space-between; align-items:center; background:#0d0a14; padding:8px; margin-top:5px; border-radius:6px;">
                    <div><strong>${p.name}</strong> - R$ ${p.price} (${p.stock} un)</div>
                    <button class="btn-action btn-danger" style="width:auto; padding:4px 8px;" onclick="removeProduct(${p.id})">Deletar</button>
                </div>
            `).join('');
        }

        initSite();
    </script>
</body>
</html>
